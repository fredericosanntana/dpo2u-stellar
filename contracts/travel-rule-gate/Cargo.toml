[package]
name = "travel-rule-gate"
description = "DPO2U — Soroban mirror of the Midnight TravelRuleGate verdict (common verdict format v1), written by M-of-N authorized relayers. Operator trust, not a proof."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
hex = "0.4"
serde_json = "1"
