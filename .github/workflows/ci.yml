name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pin SDK + CLI majors so a silent crate bump cannot break the build green.
  SOROBAN_SDK_MAJOR: "26"
  STELLAR_CLI_VERSION: "26.0.0"

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  build-wasm:
    name: stellar contract build (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm

      - name: Install stellar-cli (cached binary)
        run: |
          set -euo pipefail
          BIN_DIR="$HOME/.local/bin"
          mkdir -p "$BIN_DIR"
          curl -fsSL \
            "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            -o /tmp/stellar-cli.tar.gz
          tar -xzf /tmp/stellar-cli.tar.gz -C "$BIN_DIR"
          chmod +x "$BIN_DIR/stellar"
          echo "$BIN_DIR" >> "$GITHUB_PATH"

      - name: stellar --version
        run: stellar --version

      - name: stellar contract build
        id: build
        run: |
          stellar contract build 2>&1 | tee build.log
          # Extract wasm hash from build output for drift guard.
          HASH=$(grep -oE '[a-f0-9]{64}' build.log | head -n 1)
          echo "wasm_hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "Build wasm hash: $HASH"

      - name: Wasm size budget (≤16 KiB per contract)
        run: |
          set -euo pipefail
          # Budget applies to every contract in the workspace. Bump only with
          # PR justification — a growing contract is usually logic that belongs
          # off chain.
          for WASM in target/wasm32v1-none/release/*.wasm; do
            case "$WASM" in *.optimized.wasm) continue ;; esac
            SIZE=$(stat -c '%s' "$WASM")
            echo "$(basename "$WASM"): $SIZE bytes"
            if [ "$SIZE" -gt 16384 ]; then
              echo "::error::$(basename "$WASM") is $SIZE bytes, over the 16384 byte budget"
              exit 1
            fi
          done

      - name: Drift guard — fail PR if wasm_hash in scripts/deploy.json out of sync
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          DEPLOYED=$(python3 -c "import json; print(json.load(open('scripts/deploy.json'))['wasm_hash'])")
          BUILT="${{ steps.build.outputs.wasm_hash }}"
          if [ "$DEPLOYED" != "$BUILT" ]; then
            echo "::warning::wasm_hash drift detected"
            echo "  scripts/deploy.json: $DEPLOYED"
            echo "  built:                $BUILT"
            echo "Re-deploy required before merging if contract logic changed."
            # Drift is a warning, not a failure — many PRs touch only docs/CI and don't require re-deploy.
            # CI will block ONLY if the contract source changed.
            # Scoped to the contract scripts/deploy.json actually describes.
            # A contract crate that has never been deployed has no deployed hash
            # to drift from — that is new code, not drift, and blocking it would
            # make the immutability doctrine (evolve = new contract at a new
            # address) impossible to follow.
            if git diff --name-only origin/main...HEAD \
                 | grep -qE '^contracts/anticorruption-attestation/'; then
              echo "::error::Deployed contract source changed AND wasm_hash drifted — must re-deploy + update deploy.json"
              exit 1
            fi
          fi

      - name: Upload wasm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: |
            target/wasm32v1-none/release/*.wasm
            build.log
          retention-days: 14

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit || true
      - name: Run cargo audit
        run: cargo audit --deny warnings || echo "::warning::audit findings present (non-blocking for v0.1)"

  core:
    name: '@dpo2u/core — typecheck, tests, network-independence'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # npm 10.9.x crashes resolving the vitest 4.x peer set
      # ("Cannot read properties of null (reading 'edgesOut')").
      - name: Install
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test:run

      # The core is only network-independent for as long as this gate passes.
      # Fails on any chain SDK import, chain-native type, or runtime dependency.
      - name: Network-independence gate
        run: npm run no-chain-deps

      - name: Build
        run: npm run build

  adapter-stellar:
    name: '@dpo2u/adapter-stellar — typecheck + tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The adapter consumes @dpo2u/core as a local file: dependency, so the
      # core must be built (its .d.ts emitted) before the adapter typechecks.
      - name: Build core
        working-directory: core
        run: |
          npm install --no-audit --no-fund --legacy-peer-deps
          npm run build

      - name: Install
        working-directory: adapters/stellar
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Typecheck
        working-directory: adapters/stellar
        run: npm run typecheck

      - name: Tests
        working-directory: adapters/stellar
        run: npm run test:run

  sdk:
    name: '@dpo2u/stellar-sdk — build + tests'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Tests
        run: npm run test:run
