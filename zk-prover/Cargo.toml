# Crate autônomo — fora do workspace Soroban (depende de arkworks, não é no_std).
[workspace]

[package]
name = "zk-prover"
version = "0.1.0"
edition = "2021"
description = "DPO2U — prover Groth16/BLS12-381 do enunciado 'score >= threshold' (score privado)"
license = "Apache-2.0"

[[bin]]
name = "prove"
path = "src/main.rs"

[dependencies]
ark-bls12-381 = "0.4"
ark-groth16 = "0.4"
ark-relations = "0.4"
ark-ff = "0.4"
ark-ec = "0.4"
ark-std = "0.4"
ark-serialize = "0.4"
ark-snark = "0.4"
hex = "0.4"
